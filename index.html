<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة مكانية</title>
  <script>
    // Smart router: If phone/tablet -> mobile.html, if PC/Laptop -> teach.html
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 850);
    const forceDesktop = sessionStorage.getItem('FORCE_DESKTOP') === 'true';

    if (isMobile && !forceDesktop) {
      window.location.replace('mobile.html');
    } else {
      window.location.replace('teach.html');
    }
  </script>
</head>
<body style="background:#090d16;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">
  <div style="text-align:center">
    <h2>جاري تحميل البوابة المكانية...</h2>
    <p><a href="mobile.html" style="color:#38bdf8">واجهة الموبايل</a> | <a href="teach.html" style="color:#34d399">واجهة الكمبيوتر</a> | <a href="survey.html" style="color:#facc15">لوحة الرفع المساحي ونقاط الإحداثيات</a></p>
  </div>
</body>
</html>
